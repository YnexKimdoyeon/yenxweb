<!doctype html>
<html lang="ko" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(가상) 맛나식품 HACCP</title>
<meta name="description" content="와이넥스 포트폴리오 체험판 · 식품 제조사용 HACCP 업무관리 시스템 (양식 편집기·점검일지 주기 관리·성적서/보건증 유효기간·결재, 가상 데이터)">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<link rel="stylesheet" href="haccp.css">
<style>
  /* 체험판 보조 스타일: 원본 CSS 에 없는 것만 (모바일 메뉴 서랍, 종이 양식 글꼴) */
  html, body { background: var(--color-bg); color: var(--color-fg); }
  .demo-paper { font-family: "Nanum Myeongjo", "AppleMyungjo", "Batang", serif; color: #1a1a1a; }
  .demo-paper input, .demo-paper select, .demo-paper textarea, .demo-paper button { font-family: Pretendard, system-ui, sans-serif; }
  .demo-burger { display: none; }
  .demo-scrim { display: none; }
  @media (max-width: 1023px) {
    .demo-side { position: fixed !important; left: 0; top: 0; bottom: 0; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
    .demo-side.demo-open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.25); }
    .demo-scrim.demo-open { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.35); }
    .demo-burger { display: inline-flex; }
    .demo-hide-sm { display: none !important; }
  }
</style>
</head>
<body class="min-h-full">
<div id="app"></div>
<script src="/demos/_shared/demo.js"></script>
<script src="app.js"></script>
</body>
</html>
